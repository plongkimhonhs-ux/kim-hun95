<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Wheel 50 Names</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #2c3e50; 
    margin: 0;
    font-family: 'Khmer OS Battambang', 'Arial', sans-serif;
  }

  .wheel-wrapper {
    position: relative;
    width: 400px; 
    height: 400px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }

  .pointer {
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 15px solid transparent;
    border-bottom: 15px solid transparent;
    border-right: 35px solid #ffffff;
    filter: drop-shadow(-2px 2px 4px rgba(0,0,0,0.5));
    z-index: 10;
  }

  .center-button {
    position: absolute;
    width: 70px; 
    height: 70px;
    background-color: white;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    color: #333;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(0,0,0,0.4);
    z-index: 5;
    user-select: none;
    border: 3px solid #ccc;
    transition: opacity 0.3s;
  }
  
  .center-button:active {
    transform: scale(0.95);
  }

  .center-button.disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
</style>
</head>
<body>

<div class="wheel-wrapper">
  <div class="pointer"></div>
  <canvas id="wheelCanvas" width="800" height="800"></canvas>
  <div class="center-button" id="spinButton" onclick="spin()">Spin</div>
</div>

<script>
  const canvas = document.getElementById("wheelCanvas");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinButton");
  
  const names = [
    "ទី១", "ទី២", "ទី៣", "ទី៤", "ទី៥",
    "ទី៦", "ទី៧", "ទី៨", "ទី៩", "ទី១០",
    "ទី១១", "ទី១២", "ទី១៣", "ទី១៤", "ទី១៥",
    "ទី១៦", "ទី១៧", "ទី១៨", "ទី១៩", "ទី២០",
    "ទី២១", "ទី២២", "ទី២៣", "ទី២៤", "ទី២៥",
    "ទី២៦", "ទី២៧", "ទី២៨", "ទី២៩", "ទី៣០",
    "ទី៣១", "ទី៣២", "ទី៣៣", "ទី៣៤", "ទី៣៥",
    "ទី៣៦", "ទី៣៧", "ទី៣៨", "ទី៣៩", "ទី៤០",
    "ទី៤១", "ទី៤២", "ទី៤៣", "ទី៤៤", "ទី៤៥",
    "ទី៤៦", "ទី៤៧", "ទី៤៨", "ទី៤៩", "ទី៥០"
  ];

  const colors = ["#4285F4", "#0F9D58", "#F4B400", "#DB4437", "#9C27B0", "#E91E63"];

  const sectors = names.map((name, index) => {
      return {
          label: name,
          color: colors[index % colors.length]
      };
  });

  const numSectors = sectors.length;
  const arc = (2 * Math.PI) / numSectors;
  const radius = canvas.width / 2;
  const center = radius;

  function drawWheel() {
    for (let i = 0; i < numSectors; i++) {
      // Offset by -arc/2 so the text is perfectly centered with the right-side pointer initially
      const angle = (i * arc) - (arc / 2);
      
      ctx.beginPath();
      ctx.fillStyle = sectors[i].color;
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, angle, angle + arc);
      ctx.lineTo(center, center);
      ctx.fill();
      
      ctx.strokeStyle = "rgba(255,255,255,0.5)";
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.save();
      ctx.translate(center, center);
      // Rotate exactly to the center of the sector
      ctx.rotate(i * arc);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      
      // Use Khmer font for canvas context
      ctx.font = "bold 14px 'Khmer OS Battambang', Arial"; 
      
      if(sectors[i].color === "#F4B400") {
          ctx.fillStyle = "#000";
      } else {
          ctx.fillStyle = "#fff";
      }
      
      ctx.fillText(sectors[i].label, radius - 20, 0);
      ctx.restore();
    }
  }

  drawWheel();

  let currentRotation = 0;
  let isSpinning = false;

  function spin() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.classList.add("disabled"); // Disable visual state

    // បង្កើតដឺក្រេវិលដោយចៃដន្យ (វិល ៨ជុំ បូកដឺក្រេបន្ថែម)
    const randomDegree = Math.floor(Math.random() * 360) + (360 * 8);
    currentRotation += randomDegree;

    // ឲ្យកងវិល
    canvas.style.transform = `rotate(${currentRotation}deg)`;

    // រង់ចាំ ៥វិនាទី រហូតកងឈប់វិល ទើបរកអ្នកឈ្នះ
    setTimeout(() => {
      isSpinning = false;
      spinBtn.classList.remove("disabled"); // Enable visual state

      // គណនាដឺក្រេដើម្បីរកឈ្មោះអ្នកឈ្នះដែលនៅត្រង់ព្រួញ
      const degreesPerSector = 360 / numSectors;
      const normalizedRotation = currentRotation % 360;
      
      // Calculate adjusted winning angle (accounting for the offset we added in drawing)
      let winningAngle = (360 - normalizedRotation) % 360; 
      winningAngle = (winningAngle + degreesPerSector / 2) % 360;
      
      const winningIndex = Math.floor(winningAngle / degreesPerSector);
      const winnerName = sectors[winningIndex].label;
      
      // លោតប្រាប់អ្នកឈ្នះ
      alert(`🎉 សូមអបអរសាទរ!\nអ្នកឈ្នះគឺ៖ ${winnerName}`);

    }, 5000); 
  }
</script>

</body>
</html>
